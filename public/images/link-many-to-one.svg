<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180">
  <!-- UserLink 1 -->
  <rect x="20" y="20" width="100" height="40" rx="8" fill="#e1f5ff" stroke="#7cb3d9" stroke-width="2"/>
  <text x="70" y="45" font-family="sans-serif" font-size="12" fill="#1a5490" text-anchor="middle" font-weight="bold">UserLink</text>

  <!-- UserLink 2 -->
  <rect x="20" y="70" width="100" height="40" rx="8" fill="#e1f5ff" stroke="#7cb3d9" stroke-width="2"/>
  <text x="70" y="95" font-family="sans-serif" font-size="12" fill="#1a5490" text-anchor="middle" font-weight="bold">UserLink</text>

  <!-- UserLink 3 -->
  <rect x="20" y="120" width="100" height="40" rx="8" fill="#e1f5ff" stroke="#7cb3d9" stroke-width="2"/>
  <text x="70" y="145" font-family="sans-serif" font-size="12" fill="#1a5490" text-anchor="middle" font-weight="bold">UserLink</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ff9800" />
    </marker>
  </defs>

  <!-- Converging arrows -->
  <line x1="120" y1="40" x2="240" y2="80" stroke="#ff9800" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <line x1="120" y1="90" x2="240" y2="90" stroke="#ff9800" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <line x1="120" y1="140" x2="240" y2="100" stroke="#ff9800" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- Group (model object) -->
  <rect x="240" y="70" width="140" height="40" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <text x="310" y="88" font-family="sans-serif" font-size="14" fill="#e65100" text-anchor="middle" font-weight="bold">Group</text>
  <text x="310" y="102" font-family="sans-serif" font-size="10" fill="#e65100" text-anchor="middle">primaryGroup()</text>
</svg>
