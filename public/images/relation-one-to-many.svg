<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <!-- Alice (User, source) -->
  <rect x="20" y="130" width="160" height="60" rx="8" fill="#e1f5ff" stroke="#7cb3d9" stroke-width="2"/>
  <text x="100" y="150" font-family="sans-serif" font-size="14" fill="#1a5490" text-anchor="middle" font-weight="bold">Alice</text>
  <text x="100" y="168" font-family="sans-serif" font-size="10" fill="#1a5490" text-anchor="middle" font-style="italic">(User)</text>
  <text x="100" y="182" font-family="sans-serif" font-size="11" fill="#1a5490" text-anchor="middle">I: 1, N: 1000, C: 0</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#7cb3d9" />
    </marker>
  </defs>

  <!-- Group 0 (ordinal 0) -->
  <rect x="420" y="10" width="140" height="50" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <text x="490" y="25" font-family="sans-serif" font-size="12" fill="#e65100" text-anchor="middle" font-weight="bold">Group 0</text>
  <text x="490" y="40" font-family="sans-serif" font-size="9" fill="#e65100" text-anchor="middle" font-style="italic">(Group)</text>
  <text x="490" y="52" font-family="sans-serif" font-size="10" fill="#e65100" text-anchor="middle">I: 1, N: 1000, C: 0</text>
  <line x1="180" y1="145" x2="420" y2="35" stroke="#7cb3d9" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Group 1 (ordinal 1) -->
  <rect x="420" y="75" width="140" height="50" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <text x="490" y="90" font-family="sans-serif" font-size="12" fill="#e65100" text-anchor="middle" font-weight="bold">Group 1</text>
  <text x="490" y="105" font-family="sans-serif" font-size="9" fill="#e65100" text-anchor="middle" font-style="italic">(Group)</text>
  <text x="490" y="117" font-family="sans-serif" font-size="10" fill="#e65100" text-anchor="middle">I: 1, N: 1000, C: 1</text>
  <line x1="180" y1="150" x2="420" y2="100" stroke="#7cb3d9" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Group 2 (ordinal 2) -->
  <rect x="420" y="140" width="140" height="50" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <text x="490" y="155" font-family="sans-serif" font-size="12" fill="#e65100" text-anchor="middle" font-weight="bold">Group 2</text>
  <text x="490" y="170" font-family="sans-serif" font-size="9" fill="#e65100" text-anchor="middle" font-style="italic">(Group)</text>
  <text x="490" y="182" font-family="sans-serif" font-size="10" fill="#e65100" text-anchor="middle">I: 1, N: 1000, C: 2</text>
  <line x1="180" y1="160" x2="420" y2="165" stroke="#7cb3d9" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Group 3 (ordinal 3) -->
  <rect x="420" y="205" width="140" height="50" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <text x="490" y="220" font-family="sans-serif" font-size="12" fill="#e65100" text-anchor="middle" font-weight="bold">Group 3</text>
  <text x="490" y="235" font-family="sans-serif" font-size="9" fill="#e65100" text-anchor="middle" font-style="italic">(Group)</text>
  <text x="490" y="247" font-family="sans-serif" font-size="10" fill="#e65100" text-anchor="middle">I: 1, N: 1000, C: 3</text>
  <line x1="180" y1="170" x2="420" y2="230" stroke="#7cb3d9" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Ellipsis (more groups) -->
  <text x="490" y="285" font-family="sans-serif" font-size="20" fill="#999" text-anchor="middle">...</text>
  <text x="490" y="305" font-family="sans-serif" font-size="9" fill="#999" text-anchor="middle" font-style="italic">up to maxConnector()</text>
</svg>
