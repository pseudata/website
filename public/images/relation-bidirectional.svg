<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 180" width="550" height="180">
  <!-- Alice (User) -->
  <rect x="20" y="60" width="140" height="60" rx="8" fill="#e1f5ff" stroke="#7cb3d9" stroke-width="2"/>
  <text x="90" y="80" font-family="sans-serif" font-size="14" fill="#1a5490" text-anchor="middle" font-weight="bold">Alice</text>
  <text x="90" y="98" font-family="sans-serif" font-size="10" fill="#1a5490" text-anchor="middle" font-style="italic">(User)</text>
  <text x="90" y="112" font-family="sans-serif" font-size="11" fill="#1a5490" text-anchor="middle">I: 1, N: 1000, C: 0</text>

  <!-- Arrow markers for bidirectional -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#7cb3d9" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#66bb6a" />
    </marker>
  </defs>

  <!-- Forward arrow (mentor) -->
  <line x1="160" y1="80" x2="390" y2="80" stroke="#7cb3d9" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Backward arrow (mentee) -->
  <line x1="390" y1="100" x2="160" y2="100" stroke="#66bb6a" stroke-width="2" marker-end="url(#arrowhead-green)"/>

  <!-- Bob (Mentor) -->
  <rect x="390" y="60" width="140" height="60" rx="8" fill="#e1f5ff" stroke="#7cb3d9" stroke-width="2"/>
  <text x="460" y="80" font-family="sans-serif" font-size="14" fill="#1a5490" text-anchor="middle" font-weight="bold">Bob (Mentor)</text>
  <text x="460" y="98" font-family="sans-serif" font-size="10" fill="#1a5490" text-anchor="middle" font-style="italic">(User)</text>
  <text x="460" y="112" font-family="sans-serif" font-size="11" fill="#1a5490" text-anchor="middle">I: 1, N: 2000, C: 0</text>
</svg>
