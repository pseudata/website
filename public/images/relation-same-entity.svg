<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 180" width="500" height="180">
  <!-- Alice (User at specific coordinates) -->
  <rect x="20" y="60" width="140" height="60" rx="8" fill="#e1f5ff" stroke="#7cb3d9" stroke-width="2"/>
  <text x="90" y="80" font-family="sans-serif" font-size="14" fill="#1a5490" text-anchor="middle" font-weight="bold">Alice</text>
  <text x="90" y="98" font-family="sans-serif" font-size="10" fill="#1a5490" text-anchor="middle" font-style="italic">(User)</text>
  <text x="90" y="112" font-family="sans-serif" font-size="11" fill="#1a5490" text-anchor="middle">I: 1, N: 1000, C: 0</text>

  <!-- Arrow -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#7cb3d9" />
    </marker>
  </defs>
  <line x1="160" y1="90" x2="340" y2="90" stroke="#7cb3d9" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Bob (Mentor, different connector) -->
  <rect x="340" y="60" width="140" height="60" rx="8" fill="#e1f5ff" stroke="#7cb3d9" stroke-width="2"/>
  <text x="410" y="80" font-family="sans-serif" font-size="14" fill="#1a5490" text-anchor="middle" font-weight="bold">Bob (Mentor)</text>
  <text x="410" y="98" font-family="sans-serif" font-size="10" fill="#1a5490" text-anchor="middle" font-style="italic">(User)</text>
  <text x="410" y="112" font-family="sans-serif" font-size="11" fill="#1a5490" text-anchor="middle">I: 1, N: 2000, C: 0</text>
</svg>
