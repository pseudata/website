<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <!-- UserLink -->
  <rect x="20" y="85" width="120" height="40" rx="8" fill="#e1f5ff" stroke="#7cb3d9" stroke-width="2"/>
  <text x="80" y="110" font-family="sans-serif" font-size="14" fill="#1a5490" text-anchor="middle" font-weight="bold">UserLink</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrow-addr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#66bb6a" />
    </marker>
  </defs>

  <!-- Diverging arrows -->
  <line x1="140" y1="95" x2="240" y2="35" stroke="#66bb6a" stroke-width="2" marker-end="url(#arrow-addr)"/>
  <line x1="140" y1="100" x2="240" y2="75" stroke="#66bb6a" stroke-width="2" marker-end="url(#arrow-addr)"/>
  <line x1="140" y1="108" x2="240" y2="115" stroke="#66bb6a" stroke-width="2" marker-end="url(#arrow-addr)"/>
  <line x1="140" y1="115" x2="240" y2="155" stroke="#66bb6a" stroke-width="2" marker-end="url(#arrow-addr)"/>

  <!-- Address 1 -->
  <rect x="240" y="10" width="140" height="40" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2"/>
  <text x="310" y="28" font-family="sans-serif" font-size="12" fill="#2e7d32" text-anchor="middle" font-weight="bold">Address</text>
  <text x="310" y="42" font-family="sans-serif" font-size="10" fill="#2e7d32" text-anchor="middle">addresses()</text>

  <!-- Address 2 -->
  <rect x="240" y="60" width="140" height="40" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2"/>
  <text x="310" y="78" font-family="sans-serif" font-size="12" fill="#2e7d32" text-anchor="middle" font-weight="bold">Address</text>
  <text x="310" y="92" font-family="sans-serif" font-size="10" fill="#2e7d32" text-anchor="middle">addresses()</text>

  <!-- Address 3 -->
  <rect x="240" y="110" width="140" height="40" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2"/>
  <text x="310" y="128" font-family="sans-serif" font-size="12" fill="#2e7d32" text-anchor="middle" font-weight="bold">Address</text>
  <text x="310" y="142" font-family="sans-serif" font-size="10" fill="#2e7d32" text-anchor="middle">addresses()</text>

  <!-- Address 4 -->
  <rect x="240" y="160" width="140" height="40" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2"/>
  <text x="310" y="178" font-family="sans-serif" font-size="12" fill="#2e7d32" text-anchor="middle" font-weight="bold">Address</text>
  <text x="310" y="192" font-family="sans-serif" font-size="10" fill="#2e7d32" text-anchor="middle">addresses()</text>

  <!-- More indicator -->
  <text x="310" y="210" font-family="sans-serif" font-size="10" fill="#2e7d32" text-anchor="middle">...</text>
</svg>
