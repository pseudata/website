<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- Background -->
  <rect width="600" height="400" fill="transparent"/>

  <!-- User box (Alice) - centered vertically -->
  <rect x="50" y="160" width="200" height="80" rx="8" fill="#4682b4" stroke="#7cb3d9" stroke-width="2"/>
  <text x="150" y="190" font-family="monospace" font-size="16" fill="white" text-anchor="middle" font-weight="bold">Alice</text>
  <text x="150" y="210" font-family="monospace" font-size="11" fill="white" text-anchor="middle">(User)</text>
  <text x="150" y="230" font-family="monospace" font-size="12" fill="white" text-anchor="middle">I:1, N:1000, C:0</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7cb3d9"/>
    </marker>
  </defs>

  <!-- Arrows from User to Groups -->
  <path d="M 250 180 L 350 70" stroke="#7cb3d9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 250 200 L 350 200" stroke="#7cb3d9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 250 220 L 350 330" stroke="#7cb3d9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Group 1: Admins (C:0) -->
  <rect x="350" y="30" width="200" height="80" rx="8" fill="#4682b4" stroke="#7cb3d9" stroke-width="2"/>
  <text x="450" y="60" font-family="monospace" font-size="16" fill="white" text-anchor="middle" font-weight="bold">Admins</text>
  <text x="450" y="80" font-family="monospace" font-size="11" fill="white" text-anchor="middle">(Group)</text>
  <text x="450" y="100" font-family="monospace" font-size="12" fill="white" text-anchor="middle">I:1, N:1000, C:0</text>

  <!-- Group 2: Testers (C:1) -->
  <rect x="350" y="160" width="200" height="80" rx="8" fill="#4682b4" stroke="#7cb3d9" stroke-width="2"/>
  <text x="450" y="190" font-family="monospace" font-size="16" fill="white" text-anchor="middle" font-weight="bold">Testers</text>
  <text x="450" y="210" font-family="monospace" font-size="11" fill="white" text-anchor="middle">(Group)</text>
  <text x="450" y="230" font-family="monospace" font-size="12" fill="white" text-anchor="middle">I:1, N:1000, C:1</text>

  <!-- Group 3: Engineers (C:2) -->
  <rect x="350" y="290" width="200" height="80" rx="8" fill="#4682b4" stroke="#7cb3d9" stroke-width="2"/>
  <text x="450" y="320" font-family="monospace" font-size="16" fill="white" text-anchor="middle" font-weight="bold">Engineers</text>
  <text x="450" y="340" font-family="monospace" font-size="11" fill="white" text-anchor="middle">(Group)</text>
  <text x="450" y="360" font-family="monospace" font-size="12" fill="white" text-anchor="middle">I:1, N:1000, C:2</text>
</svg>
