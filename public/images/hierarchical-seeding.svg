<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 330" width="380" height="330">
  <!-- Stage 1: Create Generator -->
  <rect x="70" y="10" width="240" height="80" rx="8" fill="#b3d9ff" stroke="#7cb3d9" stroke-width="2"/>
  <text x="190" y="35" font-family="sans-serif" font-size="14" fill="#1a5490" text-anchor="middle" font-weight="bold">Create Generator</text>
  <text x="90" y="55" font-family="sans-serif" font-size="11" fill="#1a5490" text-anchor="start">- Seed: worldSeed</text>
  <text x="90" y="75" font-family="sans-serif" font-size="11" fill="#1a5490" text-anchor="start">- Sequence: typeSeq</text>

  <!-- Arrow 1 -->
  <path d="M 190 90 L 190 120" stroke="#7cb3d9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Stage 2: Advance by index -->
  <rect x="70" y="120" width="240" height="80" rx="8" fill="#fff4e1" stroke="#7cb3d9" stroke-width="2"/>
  <text x="190" y="145" font-family="sans-serif" font-size="14" fill="#8b6914" text-anchor="middle" font-weight="bold">Advance by index</text>
  <text x="90" y="165" font-family="sans-serif" font-size="11" fill="#8b6914" text-anchor="start">- Uses PCG32's efficient Advance()</text>
  <text x="90" y="185" font-family="sans-serif" font-size="11" fill="#8b6914" text-anchor="start">- O(1) complexity</text>

  <!-- Arrow 2 -->
  <path d="M 190 200 L 190 230" stroke="#7cb3d9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Stage 3: Generate element -->
  <rect x="70" y="230" width="240" height="80" rx="8" fill="#e8f5e9" stroke="#7cb3d9" stroke-width="2"/>
  <text x="190" y="255" font-family="sans-serif" font-size="14" fill="#1b5e20" text-anchor="middle" font-weight="bold">Generate element</text>
  <text x="90" y="275" font-family="sans-serif" font-size="11" fill="#1b5e20" text-anchor="start">- Use advanced generator state</text>
  <text x="90" y="295" font-family="sans-serif" font-size="11" fill="#1b5e20" text-anchor="start">- Call primitive generators</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7cb3d9"/>
    </marker>
  </defs>
</svg>
