<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="850" height="420">
  <!-- Background -->
  <rect width="850" height="420" fill="transparent"/>
  
  <!-- Stage 1: TypeSpec source -->
  <rect x="50" y="180" width="140" height="60" rx="8" fill="#e1f5ff" stroke="#7cb3d9" stroke-width="2"/>
  <text x="120" y="205" font-family="monospace" font-size="13" fill="#1a5490" text-anchor="middle" font-weight="bold">TypeSpec</text>
  <text x="120" y="223" font-family="sans-serif" font-size="11" fill="#1a5490" text-anchor="middle">*.tsp files</text>
  
  <!-- Stage 2: Tools/Emitters -->
  <!-- @typespec/json-schema -->
  <rect x="250" y="30" width="100" height="40" rx="6" fill="#b3d9ff" stroke="#4682b4" stroke-width="2"/>
  <text x="300" y="48" font-family="monospace" font-size="9" fill="#1a5490" text-anchor="middle">@typespec/</text>
  <text x="300" y="60" font-family="monospace" font-size="9" fill="#1a5490" text-anchor="middle">json-schema</text>
  
  <!-- interface-emitter.js -->
  <rect x="250" y="120" width="100" height="40" rx="6" fill="#b3d9ff" stroke="#4682b4" stroke-width="2"/>
  <text x="300" y="135" font-family="monospace" font-size="9" fill="#1a5490" text-anchor="middle">interface-</text>
  <text x="300" y="147" font-family="monospace" font-size="9" fill="#1a5490" text-anchor="middle">emitter.js</text>
  
  <!-- array-emitter.js -->
  <rect x="250" y="180" width="100" height="40" rx="6" fill="#b3d9ff" stroke="#4682b4" stroke-width="2"/>
  <text x="300" y="195" font-family="monospace" font-size="9" fill="#1a5490" text-anchor="middle">array-</text>
  <text x="300" y="207" font-family="monospace" font-size="9" fill="#1a5490" text-anchor="middle">emitter.js</text>
  
  <!-- resource-emitter.js -->
  <rect x="250" y="240" width="100" height="40" rx="6" fill="#b3d9ff" stroke="#4682b4" stroke-width="2"/>
  <text x="300" y="255" font-family="monospace" font-size="9" fill="#1a5490" text-anchor="middle">resource-</text>
  <text x="300" y="267" font-family="monospace" font-size="9" fill="#1a5490" text-anchor="middle">emitter.js</text>
  
  <!-- quicktype -->
  <rect x="550" y="30" width="80" height="40" rx="6" fill="#b3d9ff" stroke="#4682b4" stroke-width="2"/>
  <text x="590" y="55" font-family="sans-serif" font-size="10" fill="#1a5490" text-anchor="middle" font-weight="bold">quicktype</text>
  
  <!-- Stage 3: Generated outputs -->
  <!-- JSON Schema -->
  <rect x="410" y="30" width="100" height="40" rx="6" fill="#fff4e1" stroke="#7cb3d9" stroke-width="2"/>
  <text x="460" y="48" font-family="monospace" font-size="11" fill="#8b6914" text-anchor="middle" font-weight="bold">JSON</text>
  <text x="460" y="62" font-family="monospace" font-size="11" fill="#8b6914" text-anchor="middle" font-weight="bold">Schema</text>
  
  <!-- Primitives -->
  <rect x="410" y="120" width="100" height="40" rx="6" fill="#e8f5e9" stroke="#7cb3d9" stroke-width="2"/>
  <text x="460" y="138" font-family="monospace" font-size="11" fill="#1b5e20" text-anchor="middle" font-weight="bold">Primitives</text>
  <text x="460" y="152" font-family="sans-serif" font-size="9" fill="#1b5e20" text-anchor="middle">interfaces</text>
  
  <!-- Arrays -->
  <rect x="410" y="180" width="100" height="40" rx="6" fill="#e8f5e9" stroke="#7cb3d9" stroke-width="2"/>
  <text x="460" y="198" font-family="monospace" font-size="11" fill="#1b5e20" text-anchor="middle" font-weight="bold">Arrays</text>
  <text x="460" y="212" font-family="sans-serif" font-size="9" fill="#1b5e20" text-anchor="middle">generators</text>
  
  <!-- Resources -->
  <rect x="410" y="240" width="100" height="40" rx="6" fill="#e8f5e9" stroke="#7cb3d9" stroke-width="2"/>
  <text x="460" y="258" font-family="monospace" font-size="11" fill="#1b5e20" text-anchor="middle" font-weight="bold">Resources</text>
  <text x="460" y="272" font-family="sans-serif" font-size="9" fill="#1b5e20" text-anchor="middle">locale data</text>
  
  <!-- Models -->
  <rect x="690" y="30" width="110" height="40" rx="6" fill="#f3e5f5" stroke="#7cb3d9" stroke-width="2"/>
  <text x="745" y="48" font-family="monospace" font-size="11" fill="#4a148c" text-anchor="middle" font-weight="bold">Models</text>
  <text x="745" y="62" font-family="sans-serif" font-size="9" fill="#4a148c" text-anchor="middle">data structures</text>
  
  <!-- Arrows -->
  <!-- TypeSpec to tsp compile -->
  <path d="M 190 195 L 250 50" stroke="#7cb3d9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- TypeSpec to emitters -->
  <path d="M 190 200 L 250 140" stroke="#7cb3d9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 190 210 L 250 200" stroke="#7cb3d9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 190 220 L 250 260" stroke="#7cb3d9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- tsp compile to JSON Schema -->
  <path d="M 350 50 L 410 50" stroke="#7cb3d9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Emitters to outputs -->
  <path d="M 350 140 L 410 140" stroke="#7cb3d9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 350 200 L 410 200" stroke="#7cb3d9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 350 260 L 410 260" stroke="#7cb3d9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- JSON Schema to quicktype -->
  <path d="M 510 50 L 550 50" stroke="#7cb3d9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- quicktype to Models -->
  <path d="M 630 50 L 690 50" stroke="#7cb3d9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Stage labels -->
  <text x="120" y="280" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle" font-weight="bold">Source</text>
  <text x="300" y="310" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle" font-weight="bold">tsp compile</text>
  <text x="460" y="310" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle" font-weight="bold">Generated Code</text>
  <text x="745" y="310" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle" font-weight="bold">Generated Code</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7cb3d9"/>
    </marker>
  </defs>
</svg>
