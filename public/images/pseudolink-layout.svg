<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 714 64" width="714" height="64">
  <!-- Neighborhood (High bits: 20-39) -->
  <rect x="2" y="2" width="340" height="60" rx="8" fill="#f3e5f5" stroke="#7cb3d9" stroke-width="2"/>
  <text x="172" y="30" font-family="sans-serif" font-size="11" fill="#4a148c" text-anchor="middle" font-weight="bold">NEIGHBORHOOD</text>
  <text x="172" y="45" font-family="sans-serif" font-size="10" fill="#4a148c" text-anchor="middle" font-weight="bold">(20 bits, default)</text>

  <!-- Connector (Middle bits: 17-19) -->
  <rect x="347" y="2" width="90" height="60" rx="8" fill="#fff4e1" stroke="#7cb3d9" stroke-width="2"/>
  <text x="392" y="30" font-family="sans-serif" font-size="11" fill="#8b6914" text-anchor="middle" font-weight="bold">CONNECTOR</text>
  <text x="392" y="45" font-family="sans-serif" font-size="10" fill="#8b6914" text-anchor="middle" font-weight="bold">(3 bits)</text>

  <!-- Island (Low bits: 0-16) -->
  <rect x="442" y="2" width="270" height="60" rx="8" fill="#e1f5ff" stroke="#7cb3d9" stroke-width="2"/>
  <text x="577" y="30" font-family="sans-serif" font-size="11" fill="#1a5490" text-anchor="middle" font-weight="bold">ISLAND</text>
  <text x="577" y="45" font-family="sans-serif" font-size="10" fill="#1a5490" text-anchor="middle" font-weight="bold">(17 bits, default)</text>
</svg>
