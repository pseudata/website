<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <!-- Forward: Multiple UserLinks converging to Group -->
  <rect x="20" y="10" width="90" height="35" rx="8" fill="#e1f5ff" stroke="#7cb3d9" stroke-width="2"/>
  <text x="65" y="32" font-family="sans-serif" font-size="11" fill="#1a5490" text-anchor="middle" font-weight="bold">UserLink</text>

  <rect x="155" y="10" width="90" height="35" rx="8" fill="#e1f5ff" stroke="#7cb3d9" stroke-width="2"/>
  <text x="200" y="32" font-family="sans-serif" font-size="11" fill="#1a5490" text-anchor="middle" font-weight="bold">UserLink</text>

  <rect x="290" y="10" width="90" height="35" rx="8" fill="#e1f5ff" stroke="#7cb3d9" stroke-width="2"/>
  <text x="335" y="32" font-family="sans-serif" font-size="11" fill="#1a5490" text-anchor="middle" font-weight="bold">UserLink</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-forward" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ff9800" />
    </marker>
    <marker id="arrow-reverse" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#9c27b0" />
    </marker>
  </defs>

  <!-- Forward arrows converging -->
  <line x1="65" y1="45" x2="170" y2="78" stroke="#ff9800" stroke-width="2" marker-end="url(#arrow-forward)"/>
  <line x1="200" y1="45" x2="200" y2="78" stroke="#ff9800" stroke-width="2" marker-end="url(#arrow-forward)"/>
  <line x1="335" y1="45" x2="230" y2="78" stroke="#ff9800" stroke-width="2" marker-end="url(#arrow-forward)"/>

  <!-- Group (model object, center) -->
  <rect x="140" y="78" width="120" height="35" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <text x="200" y="93" font-family="sans-serif" font-size="12" fill="#e65100" text-anchor="middle" font-weight="bold">Group</text>
  <text x="200" y="106" font-family="sans-serif" font-size="10" fill="#e65100" text-anchor="middle">primaryGroup()</text>

  <!-- Divider -->
  <line x1="50" y1="130" x2="350" y2="130" stroke="#ccc" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- GroupLink (bottom center) -->
  <rect x="140" y="140" width="120" height="35" rx="8" fill="#e1f5ff" stroke="#7cb3d9" stroke-width="2"/>
  <text x="200" y="162" font-family="sans-serif" font-size="12" fill="#1a5490" text-anchor="middle" font-weight="bold">GroupLink</text>

  <!-- Reverse arrows diverging to Users -->
  <line x1="170" y1="175" x2="65" y2="195" stroke="#9c27b0" stroke-width="2" marker-end="url(#arrow-reverse)"/>
  <line x1="200" y1="175" x2="200" y2="195" stroke="#9c27b0" stroke-width="2" marker-end="url(#arrow-reverse)"/>
  <line x1="230" y1="175" x2="335" y2="195" stroke="#9c27b0" stroke-width="2" marker-end="url(#arrow-reverse)"/>

  <!-- Reverse: Multiple Users (model objects) -->
  <rect x="20" y="195" width="90" height="35" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2"/>
  <text x="65" y="210" font-family="sans-serif" font-size="11" fill="#2e7d32" text-anchor="middle" font-weight="bold">User</text>
  <text x="65" y="223" font-family="sans-serif" font-size="9" fill="#2e7d32" text-anchor="middle">members()</text>

  <rect x="155" y="195" width="90" height="35" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2"/>
  <text x="200" y="210" font-family="sans-serif" font-size="11" fill="#2e7d32" text-anchor="middle" font-weight="bold">User</text>
  <text x="200" y="223" font-family="sans-serif" font-size="9" fill="#2e7d32" text-anchor="middle">members()</text>

  <rect x="290" y="195" width="90" height="35" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2"/>
  <text x="335" y="210" font-family="sans-serif" font-size="11" fill="#2e7d32" text-anchor="middle" font-weight="bold">User</text>
  <text x="335" y="223" font-family="sans-serif" font-size="9" fill="#2e7d32" text-anchor="middle">members()</text>
</svg>
